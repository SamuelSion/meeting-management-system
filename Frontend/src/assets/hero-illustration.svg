<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420">
  <!-- Background blobs -->
  <ellipse cx="320" cy="230" rx="280" ry="170" fill="#eef2ff"/>
  <ellipse cx="120" cy="90" rx="60" ry="60" fill="#fff7ed"/>
  <ellipse cx="540" cy="110" rx="45" ry="45" fill="#ecfdf5"/>

  <!-- Meeting table -->
  <ellipse cx="320" cy="300" rx="190" ry="46" fill="#cbd5e1"/>
  <ellipse cx="320" cy="292" rx="190" ry="46" fill="#e2e8f0"/>

  <!-- Laptop on table -->
  <rect x="284" y="252" width="72" height="46" rx="4" fill="#1e293b"/>
  <rect x="290" y="257" width="60" height="34" rx="2" fill="#38bdf8"/>
  <rect x="270" y="296" width="100" height="8" rx="2" fill="#334155"/>

  <!-- Person 1 (orange - QA) -->
  <g>
    <ellipse cx="150" cy="300" rx="26" ry="10" fill="#00000012"/>
    <rect x="122" y="228" width="56" height="70" rx="20" fill="#f97316"/>
    <circle cx="150" cy="200" r="26" fill="#ffd8b3"/>
    <path d="M124 196c0-18 12-32 26-32s26 14 26 32" fill="#7c2d12"/>
  </g>

  <!-- Person 2 (blue - R&D) -->
  <g>
    <ellipse cx="320" cy="222" rx="28" ry="10" fill="#00000012"/>
    <rect x="290" y="146" width="60" height="76" rx="20" fill="#2563eb"/>
    <circle cx="320" cy="116" r="28" fill="#ffe4c4"/>
    <path d="M292 110c0-20 13-34 28-34s28 14 28 34" fill="#1e293b"/>
  </g>

  <!-- Person 3 (green - DevOps) -->
  <g>
    <ellipse cx="490" cy="300" rx="26" ry="10" fill="#00000012"/>
    <rect x="462" y="228" width="56" height="70" rx="20" fill="#16a34a"/>
    <circle cx="490" cy="200" r="26" fill="#f8c39a"/>
    <path d="M464 194c0-18 12-30 26-30s26 12 26 30" fill="#3f2a14"/>
  </g>

  <!-- Speech / chat bubble -->
  <g>
    <rect x="70" y="130" width="86" height="50" rx="14" fill="#ffffff" stroke="#f97316" stroke-width="3"/>
    <path d="M92 178l-10 16 20-10z" fill="#ffffff" stroke="#f97316" stroke-width="3"/>
    <circle cx="94" cy="155" r="4" fill="#f97316"/>
    <circle cx="112" cy="155" r="4" fill="#f97316"/>
    <circle cx="130" cy="155" r="4" fill="#f97316"/>
  </g>

  <!-- Calendar icon -->
  <g>
    <rect x="470" y="60" width="92" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <rect x="470" y="60" width="92" height="24" rx="10" fill="#2563eb"/>
    <rect x="486" y="46" width="8" height="20" rx="4" fill="#1e3a8a"/>
    <rect x="538" y="46" width="8" height="20" rx="4" fill="#1e3a8a"/>
    <rect x="486" y="98" width="14" height="12" rx="2" fill="#93c5fd"/>
    <rect x="510" y="98" width="14" height="12" rx="2" fill="#93c5fd"/>
    <rect x="534" y="98" width="14" height="12" rx="2" fill="#f97316"/>
    <rect x="486" y="118" width="14" height="12" rx="2" fill="#93c5fd"/>
  </g>

  <!-- Clock icon -->
  <g>
    <circle cx="560" cy="230" r="30" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <line x1="560" y1="230" x2="560" y2="212" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
    <line x1="560" y1="230" x2="573" y2="236" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
